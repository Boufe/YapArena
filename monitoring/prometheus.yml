global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: yaparena
    # Local compose only; matches METRICS_TOKEN on the app service.
    authorization:
      type: Bearer
      credentials: local-development-metrics-token-not-a-secret
    static_configs:
      - targets: [app:3000]
