name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml

  container:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target production --tag service:ci .

      - name: Scan production image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 service:ci

      - name: Build dedicated encoder image
        run: docker build --target production --build-arg MEDIA_WORKER_TOOLS=true --tag encoder:ci .

      - name: Verify encoder tools and scan image
        run: |
          docker run --rm --entrypoint ffmpeg encoder:ci -version
          docker run --rm --entrypoint ffprobe encoder:ci -version
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 encoder:ci

  # Main only: publish the web and encoder images that Render deploys by digest.
  # The shared workflow scans each pushed digest before tagging it sha-<full commit SHA>.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [web, encoder]
    uses: ./.github/workflows/reusable-publish.yml
    with:
      variant: ${{ matrix.variant }}
      platforms: linux/amd64
      tags: sha-${{ github.sha }}

  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Validate monitoring Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile monitoring config --quiet

      - name: Validate Prometheus configuration and rules
        run: >-
          docker run --rm --entrypoint promtool
          --volume "${{ github.workspace }}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          --volume "${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules:ro"
          prom/prometheus:v3.13.0
          check config /etc/prometheus/prometheus.yml

  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Validate production Compose configuration
        env:
          APP_IMAGE: ghcr.io/example/service@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgresql://yaparena_runtime:placeholder@database.example/yaparena
          DATABASE_MIGRATION_URL: postgresql://yaparena_owner:placeholder@database.example/yaparena
          APP_ORIGIN: https://service.example.com
        run: docker compose --file compose.production.yaml --profile release config --quiet

  integration:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js for browser and smoke checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install FFmpeg and native PostgreSQL verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes ffmpeg postgresql-17

      - name: Verify native PostgreSQL Unicode setup under the C locale
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          npm run verify:community-native-setup

      - name: Verify adaptive replay packaging and decoding
        run: npm run verify:media-packaging

      - name: Verify durable automatic replay publication and failure recovery
        env:
          REPLAY_POSTGRES_MODE: docker
        run: npm run verify:replay-pipeline

      - name: Create local test configuration
        run: cp .env.example .env

      - name: Start PostgreSQL
        run: docker compose up --detach --wait db

      - name: Verify core browser workflows and fresh/upgrade database isolation
        env:
          BROWSER_CHROME_PATH: /usr/bin/google-chrome
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/yaparena-browser-release
          DATABASE_TEST_MODE: docker
        # quality / check already ran the full runtime-backed quality gate.
        run: npm run verify:browser -- --integration-only

      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/yaparena-browser-release/result.json
            ${{ runner.temp }}/yaparena-browser-release/**/evidence.json
            ${{ runner.temp }}/yaparena-browser-release/**/browser-evidence.json
            ${{ runner.temp }}/yaparena-browser-release/**/*.png

      - name: Verify durable community transactions, fanout, recovery and browsers
        env:
          BROWSER_CHROME_PATH: /usr/bin/google-chrome
          COMMUNITY_SOAK_SECONDS: "30"
        run: npm run verify:community-delivery

      - name: Provision separate database identities
        run: docker compose --profile release run --rm --build provision

      - name: Apply database migrations with the migration identity
        run: docker compose --profile release run --rm migrate

      - name: Start application
        run: docker compose up --detach --build --wait app

      - name: Verify public discovery against PostgreSQL
        run: |
          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/seed-discovery.ts

          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/verify-discovery.ts

          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/verify-identity-social.ts

          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/verify-matching.ts

          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/verify-community.ts

          docker compose run --rm \
            --volume "${{ github.workspace }}/scripts:/app/scripts:ro" \
            migrate node scripts/verify-measurement.ts

          curl --fail --silent --show-error http://localhost:3000/ \
            | grep --fixed-strings 'id="ya-market-v4"'
          curl --fail --silent --show-error http://localhost:3000/live \
            | grep --fixed-strings '/topics/ai-and-human-creativity'
          curl --fail --silent --show-error http://localhost:3000/debates \
            | grep --fixed-strings 'can-ai-make-us-more-creative'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/public/debates?status=scheduled&limit=2' \
            | grep --fixed-strings '"isDemo":true'
          curl --fail --silent --show-error \
            http://localhost:3000/assets/site.css \
            | grep --fixed-strings '.site-header'
          curl --fail --silent --show-error http://localhost:3000/match \
            | grep --fixed-strings 'DEBATE MATCHING'

      - name: Verify backup and isolated restore
        env:
          BACKUP_VERIFY_LOCAL: "1"
        run: bash scripts/verify-backup-restore.sh

      - name: Smoke test the running app
        env:
          SMOKE_BASE_URL: http://localhost:3000
        run: node scripts/smoke-staging.ts

      - name: Verify desktop and mobile browser journeys and accessibility
        env:
          BROWSER_BASE_URL: http://localhost:3000
          BROWSER_DATABASE_PORT: "5433"
          BROWSER_ARTIFACT_DIR: /tmp/yaparena-browser
        run: |
          export BROWSER_CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node --env-file=.env scripts/verify-measurement-browser.ts
          node --env-file=.env scripts/verify-community-browser.ts

      - name: Verify persisted API request
        run: |
          curl --fail --silent --show-error \
            --request POST http://localhost:3000/api/auth/register \
            --header "Content-Type: application/json" \
            --cookie-jar /tmp/yaparena-ci.cookies \
            --data '{"email":"ci@example.com","password":"a secure CI passphrase"}'

          curl --fail --silent --show-error \
            --request POST http://localhost:3000/api/messages \
            --header "Content-Type: application/json" \
            --cookie /tmp/yaparena-ci.cookies \
            --data '{"name":"CI"}' \
            | grep --fixed-strings '"message":"Hello, CI!"'

          curl --fail --silent --show-error \
            --cookie /tmp/yaparena-ci.cookies \
            "http://localhost:3000/api/messages?limit=10&offset=0" \
            | grep --fixed-strings '"name":"CI"'

      - name: Show logs after failure
        if: failure()
        run: docker compose logs

      - name: Clean up containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
