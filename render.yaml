services:
  - type: web
    name: yaparena-staging-web
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/start-staging.sh
    # Operator migrates the reviewed commit separately, then manually deploys it.
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-semi-space-size=4
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      # yaparena-staging-jobs below runs every background job. Set "true" only
      # to roll back or while that worker is missing; see docs/render-staging.md.
      - key: RUN_BACKGROUND_JOBS
        value: "false"
      - key: COMMUNITY_STREAM_ENABLED
        value: "false"
      - key: APP_ORIGIN
        fromService:
          name: yaparena-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      # Bearer token for GET /metrics; production returns 404 without it.
      - key: METRICS_TOKEN
        generateValue: true

  # Dedicated background-jobs worker: A4 and coin-debate clocks, media clock and
  # recording stops, speaker revocation, Privy revocation, embedded-wallet
  # provisioning and hourly cleanup. Render has no free plan for background
  # workers: this service needs a paid instance, Starter (0.5 CPU, 512 MB) or
  # larger. It ignores RUN_BACKGROUND_JOBS and serves no HTTP. Web sets
  # RUN_BACKGROUND_JOBS=false, so keep this worker running: suspended or missing,
  # no process runs the jobs. Copy the web service's A4/coin sandbox, media,
  # Privy and Redis settings so both build the same jobs; see the cut-over in
  # docs/render-staging.md.
  - type: worker
    name: yaparena-staging-jobs
    runtime: docker
    region: ohio
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    # Deploy the same reviewed commit as web after the operator migration.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-semi-space-size=4
      - key: APP_ORIGIN
        fromService:
          name: yaparena-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
