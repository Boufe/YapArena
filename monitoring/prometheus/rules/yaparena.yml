groups:
  - name: yaparena-availability
    rules:
      - alert: YapArenaApiDown
        expr: up{job="yaparena"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: YapArena API is unavailable
          description: Prometheus has been unable to scrape the YapArena API for one minute.

  - name: yaparena-http
    rules:
      - alert: YapArenaHighErrorRate
        expr: |
          (
            sum(rate(yaparena_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(yaparena_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(rate(yaparena_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: YapArena HTTP error rate is elevated
          description: More than 5% of requests returned a 5xx response for five minutes.

      - alert: YapArenaHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(yaparena_http_request_duration_seconds_bucket[5m]))
          ) > 0.5
          and sum(rate(yaparena_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: YapArena HTTP latency is elevated
          description: The overall p95 request latency exceeded 500 ms for five minutes.
